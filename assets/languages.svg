<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="t d">
  <title id="t">Language footprint</title>
  <desc id="d">Share of code across 14 private repositories: TypeScript 68.2%, HTML 23.2%, JavaScript 4.5%, CSS 1.4%, Dart 1.2%, Python 0.8%, PL/pgSQL 0.5%, other 0.2%.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A1A"/>
      <stop offset=".6" stop-color="#0B1233"/>
      <stop offset="1" stop-color="#160B30"/>
    </linearGradient>
    <clipPath id="bar"><rect x="48" y="100" width="1104" height="20" rx="10"/></clipPath>
    <clipPath id="card"><rect width="1200" height="240" rx="22"/></clipPath>
    <linearGradient id="sh" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".3"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .f{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Inter,Helvetica,Arial,sans-serif}
    .g{transform-origin:48px 110px;animation:gr 1.6s cubic-bezier(.2,.8,.2,1) both}
    @keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .sh{animation:sw 3.4s linear infinite}
    @keyframes sw{from{transform:translateX(0)}to{transform:translateX(1340px)}}
    .n{fill:#E6EAFF;font-weight:600}
    .p{fill:#8F9BC4;font-weight:500}
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="240" fill="url(#bg)"/>
    <text class="f" x="48" y="62" font-size="24" font-weight="700" fill="#FFFFFF">Language footprint</text>
    <text class="f" x="1152" y="62" font-size="15" fill="#8F9BC4" text-anchor="end">14 private repositories · GitHub Linguist · Oct 2026</text>
    <rect x="48" y="100" width="1104" height="20" rx="10" fill="#FFFFFF" fill-opacity=".06"/>
    <g clip-path="url(#bar)">
      <g class="g">
        <rect x="48" y="100" width="752.84" height="20" fill="#3178C6"/>
        <rect x="800.84" y="100" width="255.62" height="20" fill="#E34C26"/>
        <rect x="1056.46" y="100" width="50.14" height="20" fill="#F1E05A"/>
        <rect x="1106.6" y="100" width="15.97" height="20" fill="#9B6BF2"/>
        <rect x="1122.57" y="100" width="12.88" height="20" fill="#00B4AB"/>
        <rect x="1135.45" y="100" width="9.22" height="20" fill="#5FA8E8"/>
        <rect x="1144.67" y="100" width="5.24" height="20" fill="#E879A6"/>
        <rect x="1149.91" y="100" width="2.1" height="20" fill="#8B949E"/>
      </g>
      <rect class="sh" x="-180" y="100" width="180" height="20" fill="url(#sh)"/>
    </g>
    <g class="f" font-size="16">
      <circle cx="54" cy="167" r="6" fill="#3178C6"/><text x="70" y="173"><tspan class="n">TypeScript</tspan><tspan class="p" dx="8">68.2%</tspan></text>
      <circle cx="330" cy="167" r="6" fill="#E34C26"/><text x="346" y="173"><tspan class="n">HTML</tspan><tspan class="p" dx="8">23.2%</tspan></text>
      <circle cx="606" cy="167" r="6" fill="#F1E05A"/><text x="622" y="173"><tspan class="n">JavaScript</tspan><tspan class="p" dx="8">4.5%</tspan></text>
      <circle cx="882" cy="167" r="6" fill="#9B6BF2"/><text x="898" y="173"><tspan class="n">CSS</tspan><tspan class="p" dx="8">1.4%</tspan></text>
      <circle cx="54" cy="203" r="6" fill="#00B4AB"/><text x="70" y="209"><tspan class="n">Dart</tspan><tspan class="p" dx="8">1.2%</tspan></text>
      <circle cx="330" cy="203" r="6" fill="#5FA8E8"/><text x="346" y="209"><tspan class="n">Python</tspan><tspan class="p" dx="8">0.8%</tspan></text>
      <circle cx="606" cy="203" r="6" fill="#E879A6"/><text x="622" y="209"><tspan class="n">PL/pgSQL</tspan><tspan class="p" dx="8">0.5%</tspan></text>
      <circle cx="882" cy="203" r="6" fill="#8B949E"/><text x="898" y="209"><tspan class="n">Other</tspan><tspan class="p" dx="8">0.2%</tspan></text>
    </g>
  </g>
</svg>
