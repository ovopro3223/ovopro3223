<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="t d">
  <title id="t">AI-native delivery pipeline</title>
  <desc id="d">Plan, build, review, quality gates, integrate. A change that fails the gates loops back to build.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070A1A"/><stop offset=".6" stop-color="#0B1233"/><stop offset="1" stop-color="#160B30"/></linearGradient>
    <linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#00D4FF"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient>
    <radialGradient id="dot" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#00D4FF"/><stop offset="1" stop-color="#00D4FF" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect width="1200" height="200" rx="22"/></clipPath>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#7C5CFF"/></marker>
  </defs>
  <style>.f{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Inter,Helvetica,Arial,sans-serif}</style>
  <g clip-path="url(#card)">
    <rect width="1200" height="200" fill="url(#bg)"/>
    <g stroke="#7C5CFF" stroke-opacity=".7" stroke-width="1.6" stroke-dasharray="6 8" fill="none">
      <line x1="236" y1="110" x2="289" y2="110" marker-end="url(#ar)"><animate attributeName="stroke-dashoffset" values="0;-28" dur="1s" repeatCount="indefinite"/></line>
      <line x1="461" y1="110" x2="514" y2="110" marker-end="url(#ar)"><animate attributeName="stroke-dashoffset" values="0;-28" dur="1s" repeatCount="indefinite"/></line>
      <line x1="686" y1="110" x2="739" y2="110" marker-end="url(#ar)"><animate attributeName="stroke-dashoffset" values="0;-28" dur="1s" repeatCount="indefinite"/></line>
      <line x1="911" y1="110" x2="964" y2="110" marker-end="url(#ar)"><animate attributeName="stroke-dashoffset" values="0;-28" dur="1s" repeatCount="indefinite"/></line>
      <path d="M825,76 C825,22 375,22 375,76" stroke="#00D4FF" stroke-opacity=".55" marker-end="url(#ar)"/>
    </g>
    <text class="f" x="600" y="34" font-size="12" font-weight="600" letter-spacing="3" fill="#00D4FF" text-anchor="middle">FIX AND REBUILD</text>
    <g class="f" text-anchor="middle">
      <g><rect x="64" y="78" width="172" height="64" rx="14" fill="#0F1838" stroke="url(#ac)" stroke-width="1.4"><animate attributeName="stroke-opacity" values=".35;1;.35;.35" keyTimes="0;.05;.12;1" dur="8s" begin="0s" repeatCount="indefinite"/></rect>
        <text x="150" y="105" font-size="17" font-weight="700" fill="#FFFFFF">Plan</text><text x="150" y="126" font-size="12" fill="#A9B4D8">master plan · RFCs · briefs</text></g>
      <g><rect x="289" y="78" width="172" height="64" rx="14" fill="#0F1838" stroke="url(#ac)" stroke-width="1.4"><animate attributeName="stroke-opacity" values=".35;1;.35;.35" keyTimes="0;.05;.12;1" dur="8s" begin="2s" repeatCount="indefinite"/></rect>
        <text x="375" y="105" font-size="17" font-weight="700" fill="#FFFFFF">Build</text><text x="375" y="126" font-size="12" fill="#A9B4D8">parallel agents · worktrees</text></g>
      <g><rect x="514" y="78" width="172" height="64" rx="14" fill="#0F1838" stroke="url(#ac)" stroke-width="1.4"><animate attributeName="stroke-opacity" values=".35;1;.35;.35" keyTimes="0;.05;.12;1" dur="8s" begin="4s" repeatCount="indefinite"/></rect>
        <text x="600" y="105" font-size="17" font-weight="700" fill="#FFFFFF">Review</text><text x="600" y="126" font-size="12" fill="#A9B4D8">independent reviewers</text></g>
      <g><rect x="739" y="78" width="172" height="64" rx="14" fill="#0F1838" stroke="url(#ac)" stroke-width="1.4"><animate attributeName="stroke-opacity" values=".35;1;.35;.35" keyTimes="0;.05;.12;1" dur="8s" begin="6s" repeatCount="indefinite"/></rect>
        <text x="825" y="105" font-size="17" font-weight="700" fill="#FFFFFF">Gates</text><text x="825" y="126" font-size="12" fill="#A9B4D8">types · lint · tests · guards</text></g>
      <g><rect x="964" y="78" width="172" height="64" rx="14" fill="#0F1838" stroke="url(#ac)" stroke-width="1.4"><animate attributeName="stroke-opacity" values=".35;1;.35;.35" keyTimes="0;.05;.12;1" dur="8s" begin="8s" repeatCount="indefinite"/></rect>
        <text x="1050" y="105" font-size="17" font-weight="700" fill="#FFFFFF">Integrate</text><text x="1050" y="126" font-size="12" fill="#A9B4D8">merge to main</text></g>
    </g>
    <circle r="9" fill="url(#dot)"><animateMotion dur="8s" repeatCount="indefinite" path="M150,110 H1050"/></circle>
    <circle r="4" fill="#00D4FF" opacity="0">
      <animateMotion dur="8s" repeatCount="indefinite" path="M825,76 C825,22 375,22 375,76" keyPoints="0;0;1" keyTimes="0;.74;1" calcMode="linear"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.74;.77;.97;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <text class="f" x="600" y="178" font-size="12" fill="#6B7699" text-anchor="middle">Every change walks this path. Nothing reaches main without passing the gates.</text>
  </g>
</svg>
